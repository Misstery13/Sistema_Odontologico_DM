# Producción: se aplica encima de docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
# Variables obligatorias en .env (ver .env.example). Guía completa: docs/DESPLIEGUE.md

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

  redis:
    <<: *restart

  backend:
    <<: *restart
    environment:
      DJANGO_ENV: production
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ALLOWED_HOSTS: ${SITE_ADDRESS:?Define SITE_ADDRESS en .env},backend,127.0.0.1
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      MFA_REQUIRED: ${MFA_REQUIRED:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  reminders:
    <<: *restart
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  payments:
    <<: *restart
    environment:
      DATABASE_URL: postgres://odonto:${POSTGRES_PASSWORD}@db:5432/odonto
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/pay/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    <<: *restart
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # certificados TLS: conservarlos evita re-emitirlos en cada despliegue
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      payments:
        condition: service_healthy

  # Respaldo diario de PostgreSQL con retención (por defecto 14 días) en ./backups
  backup:
    <<: *restart
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/odonto-$$(date +%F-%H%M).dump
          pg_dump -h db -U odonto -Fc odonto > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "respaldo $$f"
          find /backups -name 'odonto-*.dump' -mtime +$$RETENTION_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
