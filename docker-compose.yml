services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odonto
      POSTGRES_USER: odonto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odonto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odonto"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odonto}
      SECRET_KEY: ${SECRET_KEY:-cambiar-en-produccion}
      DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy

  # RF-11: recordatorios 48h/24h (adaptador simulado, ver logs de este servicio)
  reminders:
    build: ./backend
    command: ["sh", "-c", "sleep 30; while true; do python manage.py send_reminders; sleep 900; done"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odonto}
      SECRET_KEY: ${SECRET_KEY:-cambiar-en-produccion}
      DEBUG: "0"
    depends_on:
      - backend

  payments:
    build: ./payments
    environment:
      DATABASE_URL: postgres://odonto:${POSTGRES_PASSWORD:-odonto}@db:5432/odonto
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - payments

  # Escaneo OWASP (DAST); informes en docs/seguridad/:
  #   docker compose --profile zap run --rm zap                                   (sitio)
  #   docker compose --profile zap run --rm zap zap-api-scan.py -t http://caddy/api/schema/ -f openapi -r zap-api.html -I
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["zap"]
    command: zap-baseline.py -t http://caddy -r zap-baseline.html -I
    volumes:
      - ./docs/seguridad:/zap/wrk:rw
    depends_on:
      - caddy

volumes:
  pgdata:
